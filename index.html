<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Italiano · Verbi riflessivi</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">GRAMMATICA · A1</div>
        <h1>Verbi riflessivi</h1>
      </div>
      <div class="progress-pill" id="progress">1 / 3</div>
    </header>

    <section class="card" id="verbCard">
      <div class="verb-head">
        <div>
          <div class="verb">svegliarsi</div>
          <div class="translation">просыпаться</div>
        </div>
        <span class="badge">Presente</span>
      </div>
      <div class="conjugation" id="conjugation"></div>
      <div class="pronouns">mi · ti · si · ci · vi · si</div>
    </section>

    <section class="card practice-card">
      <div class="eyebrow">ПЕРЕВЕДИ НА ИТАЛЬЯНСКИЙ</div>
      <p class="prompt" id="prompt">Я просыпаюсь каждый день в семь.</p>

      <label for="answer" class="sr-only">Ответ</label>
      <textarea id="answer" rows="3" placeholder="Напиши ответ по-итальянски…" autocomplete="off" autocapitalize="sentences"></textarea>
      <button class="primary" id="checkBtn">Проверить</button>

      <div class="feedback hidden" id="feedback"></div>
      <div class="actions hidden" id="actions">
        <button class="secondary" id="sameVerbBtn">Ещё с этим глаголом</button>
        <button class="secondary" id="prevVerbBtn">← Повторить предыдущий</button>
        <button class="primary" id="newVerbBtn">Новый глагол →</button>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
